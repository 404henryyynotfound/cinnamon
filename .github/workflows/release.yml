name: Release cinnamon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  linux:
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install cross-arch toolchain
        if: matrix.arch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: npm install
      - run: npx electron-builder --linux --${{ matrix.arch }} --publish never
      - name: Normalize artifacts
        run: |
          mkdir -p release-assets
          for file in dist/cinnamon-linux-*.tar.gz dist/cinnamon-linux-*.deb; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            case "$name" in
              *-amd64.*) name="${name/-amd64./-${{ matrix.arch }}.}" ;;
              *-x86_64.*) name="${name/-x86_64./-${{ matrix.arch }}.}" ;;
              *-aarch64.*) name="${name/-aarch64./-${{ matrix.arch }}.}" ;;
            esac
            cp "$file" "release-assets/$name"
            (cd release-assets && sha256sum "$name" > "$name.sha256")
          done
          if [ -f pi-apps/cinnamon.zip ]; then
            cp pi-apps/cinnamon.zip release-assets/cinnamon.zip
            (cd release-assets && sha256sum cinnamon.zip > cinnamon.zip.sha256)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release-assets/*

  npm:
    runs-on: ubuntu-latest
    needs: version
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Align version with tag
        if: startsWith(github.ref_name, 'v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Publish launcher
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --prefix ./npm/launcher
          fi
          npm publish ./npm/launcher --access public || echo "Version already published; continuing"
      - name: Skip notice
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN not configured; skipping npm publish"

  snap:
    runs-on: ${{ matrix.runner }}
    needs: linux
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Align version with tag
        if: startsWith(github.ref_name, 'v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: '$VERSION'/" snapcraft.yaml
          sed -i "s/^version: .*/version: '$VERSION'/" snap/snapcraft.yaml
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
          path: dist
      - id: snapcraft
        uses: snapcore/action-build@v1
      - run: sha256sum "${{ steps.snapcraft.outputs.snap }}" > "${{ steps.snapcraft.outputs.snap }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: |
            ${{ steps.snapcraft.outputs.snap }}
            ${{ steps.snapcraft.outputs.snap }}.sha256
      - name: Publish to Snap Store
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        run: snapcraft upload --release=stable "${{ steps.snapcraft.outputs.snap }}"

  release:
    runs-on: ubuntu-latest
    needs: [version, linux, snap]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            if gh release create "$TAG" --generate-notes --title "$TAG"; then break; fi
            sleep $((attempt * 5))
          done
          for attempt in 1 2 3; do
            if gh release upload "$TAG" release-assets/* --clobber; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "Failed to upload release assets" >&2
          exit 1
